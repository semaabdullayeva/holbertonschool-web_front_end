<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h2>Login to the website</h2>
    <input type="text" id="firstname" name="firstname" placeholder="Firstname">
    <input type="email" id="email" name="email" placeholder="Email">

    <button onclick="setCookies()">Log me in</button>
    <h2>Cookies</h2>
    <button onclick="showCookies()">Show the cookies</button>

    <script>
        function setCookies() {
            var firstname = document.getElementById('firstname').value;
            var email = document.getElementById('email').value;

            var expirationDate = new Date();
            expirationDate.setTime(expirationDate.getTime() + (10 * 24 * 60 * 60 * 1000)); // 10 days in milliseconds
            var expires = "expires=" + expirationDate.toUTCString();

            document.cookie = 'firstname=' + encodeURIComponent(firstname) + '; ' + expires + '; path=/';
            document.cookie = 'email=' + encodeURIComponent(email) + '; ' + expires + '; path=/';

            document.getElementById('firstname').value = '';
            document.getElementById('email').value = '';
        }

        function getCookie(name) {
            var nameEQ = name + "=";
            var ca = document.cookie.split(';');
            for (var i = 0; i < ca.length; i++) {
                var c = ca[i];
                while (c.charAt(0) == ' ') c = c.substring(1);
                if (c.indexOf(nameEQ) == 0) {
                    return decodeURIComponent(c.substring(nameEQ.length, c.length));
                }
            }
            return '';
        }

        function showCookies() {
            var p = document.createElement('p');
            var email = getCookie('email');
            var firstname = getCookie('firstname');
            p.innerHTML = 'Email: ' + email + ' - Firstname: ' + firstname;
            document.body.appendChild(p);
        }
    </script>

</body>

</html>
